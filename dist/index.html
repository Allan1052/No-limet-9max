  <script>
    // Definição contra cache preso do in-app browser (Instagram/WhatsApp):
    // o WebView do Instagram segura o HTML por dias. Este script:
    // 1) pede o sw.js mais novo da rede (ignora o cache do WebView) e registra
    //    — se houver SW novo, ele troca o precache (inclui o index.html novo);
    // 2) se o SW ativo for antigo, envia SKIP_WAITING para assumir de imediato;
    // 3) se o main.js do <head> der 404 (HTML antigo + servidor novo), faz
    //    hard reload com ?u= agora, limpando SW/caches antes.
    (function() {
      try {
        if ('serviceWorker' in navigator) {
          fetch('/sw.js', { cache: 'no-store' }).then(function(res) {
            if (!res.ok) return;
            navigator.serviceWorker.register('/sw.js').then(function(reg) {
              if (reg.waiting) reg.waiting.postMessage({ type: 'SKIP_WAITING' });
            }).catch(function() {});
          }).catch(function() {});
        }
        // verifica se o bundle do head existe no servidor (prova de que o HTML é atual)
        var mod = document.querySelector('script[type="module"]');
        if (mod && mod.src) {
          fetch(mod.src, { method: 'HEAD' }).then(function(res) {
            if (!res.ok) location.reload();
          }).catch(function() { /* rede instável: deixa o script de error handler cuidar */ });
        }
        // in-app browser (Instagram/WhatsApp): o HTML pode estar preso no
        // precache do SW. Pede o index.html da REDE (ignora cache) e compara
        // o bundle que ele referencia: se for diferente do atual, o HTML é
        // velho — limpa tudo e recarrega com cache-buster.
        if (mod && mod.src) {
          var currentBundle = mod.src.split('/').pop();
          fetch('/index.html', { cache: 'no-store', headers: { 'Accept': 'text/html' } })
            .then(function(res) {
              if (!res.ok) return;
              return res.text().then(function(html) {
                var m = html.match(/\/assets\/main-[A-Za-z0-9_-]+\.js/);
                if (m && m[0].split('/').pop() !== currentBundle) {
                  if ('serviceWorker' in navigator) {
                    navigator.serviceWorker.getRegistrations().then(function(regs) {
                      regs.forEach(function(r) { r.unregister(); });
                    });
                  }
                  if (typeof caches !== 'undefined') {
                    try {
                      caches.keys().then(function(keys) {
                        keys.forEach(function(k) { caches.delete(k); });
                      });
                    } catch (e) { /* ignorar */ }
                  }
                  location.href = '/?u=' + Date.now();
                }
              });
            })
            .catch(function() { /* rede instável: sem ação */ });
        }
      } catch (e) { /* ignorar */ }
    })();
  </script>

<div id="root"></div>
    <div id="fallback-screen" style="display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:#0d0f0d;z-index:99999;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px;text-align:center;font-family:system-ui,sans-serif;color:#e8e6dc">

      <button onclick="location.reload()" style="border:1px solid #c9b458;background:linear-gradient(180deg,#d4af37,#c9b458);color:#0d0f0d;font-weight:800;font-size:15px;padding:12px 18px;border-radius:10px;cursor:pointer;width:min(320px,90vw)">🔄 Recarregar</button>
      <!-- Meta Pixel no-script fallback -->
      <noscript><img height="1" width="1" style="display:none" src="https://www.facebook.com/tr?id=2895094507517479&ev=PageView&noscript=1"/></noscript>
      <button onclick="(async()=>{if('serviceWorker'in navigator){const r=await navigator.serviceWorker.getRegistrations();await Promise.all(r.map(x=>x.unregister()))}if(typeof caches!=='undefined'){const k=await caches.keys();await Promise.all(k.map(c=>caches.delete(c)))}localStorage.clear();location.href=location.pathname+location.search+location.hash})();location.reload()" style="border:1px solid #c9b458;background:transparent;color:#c9b458;font-weight:800;font-size:15px;padding:12px 18px;border-radius:10px;cursor:pointer;width:min(320px,90vw)">🗑️ Limpar cache e recarregar</button>
    </div>
    <script>
      // Fallback: se o React não renderizar em 5 segundos, mostra tela de recuperação
      setTimeout(function(){
        var root = document.getElementById('root');
        var fb = document.getElementById('fallback-screen');
        if(root && root.children.length === 0 && fb) {
          fb.style.display = 'flex';
        }
      }, 5000);

      // Auto-recovery: se o bundle JS falhar, tenta recarregar com cache-buster
      // (Isso resolve o problema de "app fora do ar" após deploy no GitHub Pages)
      // Otimização de abertura: enquanto o usuário lê a landing, o bundle
      // principal já começa a ser baixado (sem bloquear a renderização).
      try {
        var lh = document.querySelector('script[type="module"]');
        if (lh && lh.src) {
          var preload = document.createElement('link');
          preload.rel = 'modulepreload';
          preload.href = lh.src;
          document.head.appendChild(preload);
        }
      } catch (err) { /* ignorar: a entrada via /src/main.tsx continua normal */ }

      window.addEventListener('error', function(e) {
        if (e.filename && e.filename.includes('/assets/')) {
          // Provavelmente um bundle antigo que não existe mais no servidor
          console.warn('Bundle antigo não encontrado, fazendo hard reload...');
          // limpeza síncrona + redirecionamento com cache-buster (resolve
          // HTML/bundle antigos presos no cache do in-app browser)
          if ('serviceWorker' in navigator && navigator.serviceWorker.controller) {
            navigator.serviceWorker.controller.postMessage({ type: 'CLEAR_ALL' });
            navigator.serviceWorker.getRegistrations().then(function(regs) {
              regs.forEach(function(r) { r.unregister(); });
            });
          }
          if (typeof caches !== 'undefined') {
            try {
              caches.keys().then(function(keys) {
                keys.forEach(function(k) { caches.delete(k); });
              });
            } catch (err2) { /* ignorar */ }
          }
          localStorage.removeItem('cof-sw-version');
          var url = location.href;
          if (url.indexOf('?u=') === -1) {
            location.href = url + (url.indexOf('?') === -1 ? '?' : '&') + 'u=' + Date.now();
          } else {
            location.href = url.replace(/u=\d+/, 'u=' + Date.now());
          }
        }
      }, true);
    </script>
