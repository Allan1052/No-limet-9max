<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#14170f" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Call ou Fold" />
    <link rel="apple-touch-icon" href="/brand-apple-touch.png" />
    <title>Call ou Fold — Texas Hold'em e Omaha</title>
    <meta
      name="description"
      content="Call ou Fold: simulador de poker profissional. Texas Hold'em e Omaha (PLO) com ranges do João Simão. Treine grátis e evolua seu jogo agora."
    />
  </head>
  <body>
    <div id="root"></div>
    <div id="fallback-screen" style="display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:#0d0f0d;z-index:99999;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px;text-align:center;font-family:system-ui,sans-serif;color:#e8e6dc">
      <div style="font-size:40px">&#9824;</div>
      <h2 style="color:#d4af37;margin:0">Carregamento travou</h2>
      <p style="color:#9a988c;max-width:420px;line-height:1.5;margin:0">O app n&#227;o carregou. Toque abaixo para tentar novamente.</p>
      <button onclick="location.reload()" style="border:1px solid #c9b458;background:linear-gradient(180deg,#d4af37,#c9b458);color:#0d0f0d;font-weight:800;font-size:15px;padding:12px 18px;border-radius:10px;cursor:pointer;width:min(320px,90vw)">&#128260; Recarregar</button>
      <button onclick="(async()=>{if('serviceWorker'in navigator){const r=await navigator.serviceWorker.getRegistrations();await Promise.all(r.map(x=>x.unregister()))}if(typeof caches!=='undefined'){const k=await caches.keys();await Promise.all(k.map(c=>caches.delete(c)))}localStorage.clear();location.reload()})()" style="border:1px solid #c9b458;background:transparent;color:#c9b458;font-weight:800;font-size:15px;padding:12px 18px;border-radius:10px;cursor:pointer;width:min(320px,90vw)">&#128465; Limpar cache e recarregar</button>
    </div>
    <script>setTimeout(function(){var root=document.getElementById('root');var fb=document.getElementById('fallback-screen');if(root&&root.children.length===0&&fb)fb.style.display='flex'},5000)</script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
