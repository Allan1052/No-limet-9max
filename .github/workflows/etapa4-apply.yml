name: Aplicar Etapa 4
on:
  push:
    branches:
      - openai/ui-etapa-4-session-progress
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: openai/ui-etapa-4-session-progress
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Integrar progresso da sessão
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/app/App.tsx')
          s = p.read_text()
          imp = 'import { HandResultSummary } from "../ui/HandResultSummary";\n'
          new_imp = 'import { SessionProgressStrip } from "../ui/SessionProgressStrip";\n'
          if new_imp not in s:
              if imp not in s:
                  raise SystemExit('import alvo não encontrado')
              s = s.replace(imp, imp + new_imp, 1)
          anchor = '''      ) : (\n        <div className="play">\n          <PokerTable'''
          insert = '''      ) : (\n        <div className="play">\n          <SessionProgressStrip summary={progress} />\n          <PokerTable'''
          if '<SessionProgressStrip summary={progress} />' not in s:
              if anchor not in s:
                  raise SystemExit('ponto de integração não encontrado')
              s = s.replace(anchor, insert, 1)
          p.write_text(s)
          PY
      - run: npm install
      - run: npm test
      - run: npm run build
      - name: Commitar integração
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/App.tsx
          git diff --cached --quiet || git commit -m "ui: integrar progresso compacto da sessão"
          git push origin HEAD:openai/ui-etapa-4-session-progress
