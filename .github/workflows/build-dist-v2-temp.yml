name: Gerar dist V2 temporario

on:
  push:
    branches:
      - motor-v2-realismo-clean

permissions:
  contents: write

jobs:
  build-dist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: motor-v2-dist
          path: dist
          if-no-files-found: error
      - name: Commit dist atualizado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A dist
          if git diff --cached --quiet; then
            echo "dist ja esta sincronizado"
            exit 0
          fi
          git commit -m "build: atualiza dist do Motor V2"
          git push origin HEAD:motor-v2-realismo-clean
