name: Gerar dist V2 temporario

on:
  push:
    branches:
      - motor-v2-realismo-clean

permissions:
  contents: read

jobs:
  build-dist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: motor-v2-dist
          path: dist
          if-no-files-found: error
