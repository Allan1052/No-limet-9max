name: RED Etapa 3
on:
  push:
    branches:
      - openai/ui-etapa-3-feedback
jobs:
  red:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install
      - run: npx vitest run src/ui/handResultSummary.test.js
