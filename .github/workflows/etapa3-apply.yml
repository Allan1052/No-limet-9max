name: Aplicar Etapa 3
on:
  push:
    branches:
      - openai/ui-etapa-3-feedback
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: openai/ui-etapa-3-feedback
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Integrar resumo pós-mão
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/app/App.tsx')
          s = p.read_text()
          imp = 'import { HandActions } from "../ui/HandActions";\n'
          if 'import { HandResultSummary } from "../ui/HandResultSummary";' not in s:
              if imp not in s:
                  raise SystemExit('import alvo não encontrado')
              s = s.replace(imp, imp + 'import { HandResultSummary } from "../ui/HandResultSummary";\n', 1)
          anchor = '''            buyIn={controller.tournament?.buyIn}\n          />\n\n          {handOver ? ('''
          insert = '''            buyIn={controller.tournament?.buyIn}\n          />\n\n          {handOver && controller.feedback.length > 0 ? (\n            <HandResultSummary\n              feedback={controller.feedback}\n              onOpenTips={() => setTipsOpen(true)}\n            />\n          ) : null}\n\n          {handOver ? ('''
          if '<HandResultSummary' not in s:
              if anchor not in s:
                  raise SystemExit('ponto de integração não encontrado')
              s = s.replace(anchor, insert, 1)
          p.write_text(s)
          PY
      - run: npm install
      - run: npm test
      - run: npm run build
      - name: Commitar integração
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/App.tsx
          git diff --cached --quiet || git commit -m "ui: integrar resumo visual pós-mão"
          git push origin HEAD:openai/ui-etapa-3-feedback
