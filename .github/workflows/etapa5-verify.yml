name: Verificar Etapa 5
on:
  push:
    branches:
      - openai/ui-etapa-5-mobile-polish
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - run: npx vitest run src/ui/mobilePolish.contract.test.ts
      - run: npm run build
