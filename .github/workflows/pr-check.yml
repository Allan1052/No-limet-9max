name: Validar Pull Request

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
      - run: npm test
      - name: Anexar previews visuais do card de referência
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reference-card-preview
          path: preview/*.svg
          if-no-files-found: ignore
      - run: npm run build
