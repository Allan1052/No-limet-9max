name: Validar Pull Request

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
      - run: npm test
      - run: npm run build
      - name: Registrar rodada 4 e commitar dist
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("MUDANCAS.md")
          text = p.read_text(encoding="utf-8")
          title = "## 2026-09-08 — ChatGPT — Mesa rodada 4: cockpit, saída e atualização"
          if title not in text:
              entry = """\n## 2026-09-08 — ChatGPT — Mesa rodada 4: cockpit, saída e atualização\n- O botão **Treinar** volta a abrir primeiro o hub de treinos; a mesa não captura mais a navegação automaticamente.\n- A mesa ganhou **X para sair**, entorno mais claro e geometria centralizada; Fold/Call/Raise ficam lado a lado e Pote/4BB/3BB/2BB viraram a coluna rápida à direita.\n- A setinha agora abre só o **ajuste fino por slider**, e o botão de versão do Perfil força atualização real do PWA com feedback visível. Onde: **mesa, Treinar e Perfil**. Sem mudança no motor.\n"""
              marker = "---\n"
              pos = text.find(marker)
              if pos < 0:
                  raise SystemExit("marcador de MUDANCAS.md não encontrado")
              pos += len(marker)
              text = text[:pos] + entry + text[pos:]
              p.write_text(text, encoding="utf-8")
          PY
          git config user.name "Call ou Fold CI"
          git config user.email "actions@users.noreply.github.com"
          git add -A -f -- dist MUDANCAS.md
          if git diff --cached --quiet; then
            echo "nenhuma mudança de dist/registro para commitar"
            exit 0
          fi
          git commit -m "build: rebuild dist rodada 4"
          git push origin HEAD:${{ github.head_ref }}
