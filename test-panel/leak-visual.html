    text: "x",
    advice: "fold",
    action: "call",
    adviceFam: "fold",

    kind: "preflop",

    { handFeedback: [fakeItem, fakeItem, fakeItem], events: [] },
    { handFeedback: [fakeItem, fakeItem, fakeItem], events: [] },

  root.render(
    React.createElement(LeaksPanel, {
